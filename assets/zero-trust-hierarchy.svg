<svg xmlns="http://www.w3.org/2000/svg" id="ztx-diagram" viewBox="0 0 1180 470"
     width="100%" role="group" aria-labelledby="ztx-title" aria-describedby="ztx-desc"
     style="background-color: transparent;">
<title id="ztx-title">Zero-Trust Hierarchy authority and evidence flow</title>
<desc id="ztx-desc">The Architect / Owner ratifies governing documents, the documents authorize and constrain the Orchestrator, and the Orchestrator returns state, evidence, and decision requests to the Owner. The same human appears again at the checkpoint seam, where a brief travels down to one visible execution track of zero to many, and a packet travels back up. Inside the track the human exchanges brief and packet with the Engineering Lead, which exchanges goal plus bar for artifact plus verdicts with a replaceable, internally iterative Gauntlet Loop credited to Matt Shumer.</desc>

<style>
  #ztx-diagram {
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #ztx-diagram text { font-size: 12.5px; }
  #ztx-diagram .band {
    fill: none;
    stroke: var(--diagram-line, #7f7669);
    stroke-width: 1px;
    opacity: .42;
  }
  #ztx-diagram .band-label {
    fill: var(--diagram-muted, #46515c);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
  }
  #ztx-diagram .node > rect {
    fill: var(--diagram-panel, #f2eee5);
    stroke: var(--diagram-line, #7f7669);
    stroke-width: 1.25px;
  }
  #ztx-diagram .node--human > rect {
    stroke: var(--diagram-accent, #8a3216);
    stroke-width: 1.6px;
  }
  #ztx-diagram .node--swappable > rect {
    stroke: var(--diagram-accent, #8a3216);
    stroke-dasharray: 5 4;
  }
  #ztx-diagram .n-title {
    fill: var(--diagram-ink, #18212b);
    font-size: 14px;
    font-weight: 650;
  }
  #ztx-diagram .n-detail {
    fill: var(--diagram-muted, #46515c);
    font-size: 12.5px;
  }
  #ztx-diagram .flow {
    fill: none;
    stroke: var(--diagram-line, #7f7669);
    stroke-width: 1.25px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #ztx-diagram .flow--same {
    stroke: var(--diagram-accent, #8a3216);
    stroke-dasharray: 2.5 4.5;
    opacity: .85;
  }
  #ztx-diagram .e-label {
    fill: var(--diagram-muted, #46515c);
    font-size: 12.5px;
  }
  #ztx-diagram .e-label--note { font-style: italic; }
  #ztx-diagram .n-link {
    fill: var(--diagram-accent, #8a3216);
    font-size: 12.5px;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  #ztx-diagram a:hover .n-link { text-decoration-thickness: 2px; }
</style>

<defs>
  <marker id="ztx-arrow" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="var(--diagram-line, #7f7669)"/>
  </marker>
  <marker id="ztx-arrow-accent" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="var(--diagram-accent, #8a3216)"/>
  </marker>
</defs>

<!-- ========================= Band A — the governance loop ========================= -->
<rect class="band" x="6" y="6" width="1168" height="246" rx="10"/>
<text class="band-label" text-anchor="end" x="1148" y="27">Top governance loop</text>

<!-- the human source of purpose : upper left -->
<g class="node node--human" id="ztx-owner">
  <rect x="60" y="48" width="280" height="86" rx="7"/>
  <text text-anchor="middle">
    <tspan class="n-title"  x="200" y="77">Architect / Owner — human</tspan>
    <tspan class="n-detail" x="200" y="97">purpose · ratification</tspan>
    <tspan class="n-detail" x="200" y="115">strategic direction</tspan>
  </text>
</g>

<!-- what the Owner has ratified : upper right -->
<g class="node" id="ztx-documents">
  <rect x="840" y="48" width="280" height="86" rx="7"/>
  <text text-anchor="middle">
    <tspan class="n-title"  x="980" y="77">Governing documents</tspan>
    <tspan class="n-detail" x="980" y="97">ratified plans · rulebook</tspan>
    <tspan class="n-detail" x="980" y="115">roles · configuration · map</tspan>
  </text>
</g>

<!-- authorization, beneath both -->
<g class="node" id="ztx-orchestrator">
  <rect x="450" y="156" width="280" height="86" rx="7"/>
  <text text-anchor="middle">
    <tspan class="n-title"  x="590" y="185">Orchestrator</tspan>
    <tspan class="n-detail" x="590" y="205">WHAT · WHEN · WHERE · ceiling</tspan>
    <tspan class="n-detail" x="590" y="223">receipt · closure eligibility</tspan>
  </text>
</g>

<path class="flow" d="M342 91 H832" marker-end="url(#ztx-arrow)"/>
<text class="e-label" text-anchor="middle" x="587" y="82">ratifies</text>

<path class="flow" d="M980 136 V189 Q980 199 970 199 H738" marker-end="url(#ztx-arrow)"/>
<text class="e-label" text-anchor="middle" x="855" y="187">authorizes and constrains</text>

<path class="flow" d="M448 199 H280 Q270 199 270 189 V142" marker-end="url(#ztx-arrow)"/>
<text class="e-label" text-anchor="middle" x="360" y="172">state · evidence</text>
<text class="e-label" text-anchor="middle" x="360" y="188">decision request</text>

<!-- ============================ The checkpoint seam ============================ -->

<!-- one person, two operational hats -->
<path class="flow flow--same" d="M140 136 V360" marker-end="url(#ztx-arrow-accent)"/>
<text class="e-label e-label--note" text-anchor="middle" x="70" y="294">same human ·</text>
<text class="e-label e-label--note" text-anchor="middle" x="70" y="310">two hats</text>

<!-- authority down -->
<path class="flow" d="M520 242 V272 Q520 282 510 282 H236 Q226 282 226 292 V360"
      marker-end="url(#ztx-arrow)"/>
<text class="e-label" text-anchor="middle" x="373" y="273">brief</text>

<!-- evidence up -->
<path class="flow" d="M286 360 V316 Q286 306 296 306 H650 Q660 306 660 296 V242"
      marker-end="url(#ztx-arrow)"/>
<text class="e-label" text-anchor="middle" x="560" y="297">packet</text>

<!-- ======================= Band B — one execution track ======================= -->
<rect class="band" x="6" y="330" width="1168" height="136" rx="10"/>
<text class="band-label" text-anchor="end" x="1148" y="351">One visible execution track of 0…N</text>

<!-- the same human, judging a bounded return -->
<g class="node node--human" id="ztx-human">
  <rect x="46" y="368" width="280" height="86" rx="7"/>
  <text text-anchor="middle">
    <tspan class="n-title"  x="186" y="397">Human — development manager</tspan>
    <tspan class="n-detail" x="186" y="417">same Architect / Owner · courier</tspan>
    <tspan class="n-detail" x="186" y="435">judgment · veto · disposition</tspan>
  </text>
</g>

<!-- the execution authority -->
<g class="node" id="ztx-lead">
  <rect x="450" y="368" width="280" height="86" rx="7"/>
  <text text-anchor="middle">
    <tspan class="n-title"  x="590" y="397">Engineering Lead</tspan>
    <tspan class="n-detail" x="590" y="417">HOW · decomposition</tspan>
    <tspan class="n-detail" x="590" y="435">one-writer integration</tspan>
  </text>
</g>

<!-- the replaceable inner method -->
<g class="node node--swappable" id="ztx-gauntlet">
  <rect x="854" y="368" width="280" height="86" rx="7"/>
  <text class="n-title" text-anchor="middle" x="994" y="397">Gauntlet Loop — Matt Shumer</text>
  <a href="https://somethingbig.ai/gauntlet-loop">
    <text class="n-link" text-anchor="middle" x="994" y="417">somethingbig.ai/gauntlet-loop</text>
  </a>
  <text class="n-detail" text-anchor="middle" x="994" y="435">replaceable · ↻ internally iterative</text>
</g>

<path class="flow" d="M328 396 H442" marker-end="url(#ztx-arrow)"/>
<text class="e-label" text-anchor="middle" x="388" y="387">brief</text>
<path class="flow" d="M448 426 H334" marker-end="url(#ztx-arrow)"/>
<text class="e-label" text-anchor="middle" x="388" y="417">packet</text>

<path class="flow" d="M732 396 H846" marker-end="url(#ztx-arrow)"/>
<text class="e-label" text-anchor="middle" x="792" y="387">goal + bar</text>
<path class="flow" d="M852 426 H738" marker-end="url(#ztx-arrow)"/>
<text class="e-label" text-anchor="middle" x="792" y="417">artifact + verdicts</text>
</svg>
